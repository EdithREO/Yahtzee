<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快艇骰子 · 房间</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="networkNotice" role="status" aria-live="polite" hidden></div><main><header><span class="mark">◆</span><p>YACHT DUEL</p><h1>快艇骰子</h1><small>双人房间</small></header>
<div id="connection" class="connection">正在连接服务器…</div><p id="error" role="alert"></p>
<section id="home"><h2>欢迎入座</h2><button id="create">创建房间</button><div class="divider">或加入已有房间</div><label for="code">六位房间码</label><div class="join"><input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000"><button id="join">加入房间</button></div></section>
<section id="lobby" hidden><h2>等待大厅</h2><div class="roomcode"><span>房间码</span><strong id="roomcode"></strong></div><p id="count"></p><div class="seats"><div id="seat0"></div><div id="seat1"></div></div><button id="start">开始游戏</button><button class="secondary leave">退出房间</button></section>
<section id="test" hidden><h2>双人快艇骰子</h2><p>房间 <strong id="testcode"></strong> · <span id="testcount"></span></p><p id="teststatus"></p><p id="turn"></p><iframe id="viewer" allow="autoplay" title="骰盘" src="/viewer/index.html"></iframe><div id="holds" class="holds"></div><button id="roll" disabled>等待骰盘加载</button><p id="values">等待投掷</p><label for="category">选择计分项目结束回合</label><select id="category"><option value="">请选择</option></select><button id="commit" class="secondary" disabled>记分并结束回合</button><table id="scores"><thead><tr><th>项目</th><th>玩家 A</th><th>玩家 B</th></tr></thead><tbody></tbody><tfoot><tr><th>总分（含奖励）</th><td id="total0">0</td><td id="total1">0</td></tr></tfoot></table><p id="performance"></p><p id="network"></p><p id="sync"></p><button id="send" class="secondary">发送测试消息</button><p id="messages" aria-live="polite">等待消息</p><button class="secondary leave">退出房间</button></section>
<footer>每回合最多三投 · 点击保留 · 选择项目记分</footer></main><script src="/app.js"></script></body></html>
